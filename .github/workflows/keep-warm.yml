name: Keep Render warm

# Render's free plan spins the backend down after inactivity; cold starts take
# 30-60s, which breaks OAuth callback flows for every connector. Ping /health
# every 10 minutes to keep the instance warm.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET /health
        run: |
          curl --fail-with-body --silent --show-error --max-time 90 \
            https://channelzero.onrender.com/health
